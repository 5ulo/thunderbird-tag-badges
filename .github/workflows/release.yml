name: Publish XPI release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate version and prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('manifest.json').read_text())
          version = manifest['version']
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit('Release tag must match manifest.json version')
          section = Path('CHANGELOG.md').read_text().split(f'## {version}\n', 1)[1].split('\n## ', 1)[0].strip()
          notes = f'''Colorful tag badges in Thunderbird’s message list.

          Displays built-in and custom tags in table and cards views, with configurable positioning, independent limits, whole-badge overflow counters, sizes and display order.

          ## Changes in {version}

          {section}

          ## Compatibility

          Thunderbird **{manifest['browser_specific_settings']['gecko']['strict_min_version']}–{manifest['browser_specific_settings']['gecko']['strict_max_version']}**. Validated on **128.9.1 and 161.0 on macOS**. Future major versions beyond this range are not supported by this package.

          ## Installation

          Download `tag-badges-thread-pane-{version}.xpi` below. In Thunderbird, open **Add-ons and Themes → Extensions → gear menu → Install Add-on From File…** and select the XPI. Existing settings are preserved when updating.

          Settings follow Thunderbird’s UI language: English and Slovak are included, with English as fallback. The add-on uses an Experiment API, so Thunderbird requests full access. It does not modify messages or tag assignments. Thunderbird checks GitHub Releases for updates; no message data is sent.

          **Author:** EnjoyDev · **License:** MIT
          '''
          Path(os.environ['RUNNER_TEMP'], 'release-notes.md').write_text(notes)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'XPI_PATH=dist/tag-badges-thread-pane-{version}.xpi\n')
          PY
      - name: Run unit tests
        run: node --test tests/*.test.cjs
      - name: Test update metadata generator
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build and validate XPI
        run: |
          python3 scripts/build.py
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile(os.environ['XPI_PATH']) as archive:
              assert archive.testzip() is None
              for name in archive.namelist():
                  assert archive.read(name) == Path(name).read_bytes(), name
                  assert not name.startswith(('tests/', 'scripts/')), name
          PY
          (cd dist && sha256sum "$(basename "$XPI_PATH")" > "$(basename "$XPI_PATH").sha256")
      - name: Generate update metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/previous-updates"
          gh release view --json assets --jq '.assets[].name' > "$RUNNER_TEMP/release-assets.txt"
          if grep -Fxq 'updates.json' "$RUNNER_TEMP/release-assets.txt"; then
            gh release download --pattern updates.json --dir "$RUNNER_TEMP/previous-updates"
            python3 scripts/update_manifest.py --previous "$RUNNER_TEMP/previous-updates/updates.json"
          else
            python3 scripts/update_manifest.py
          fi
      - name: Publish release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" "$XPI_PATH" "$XPI_PATH.sha256" "dist/updates.json" --verify-tag --draft --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release edit "$RELEASE_TAG" --draft=false --latest
